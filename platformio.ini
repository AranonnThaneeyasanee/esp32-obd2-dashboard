; ============================================================
; OBD2 Smart Dashboard — PlatformIO Configuration
; ============================================================
; esp32s3-dashboard : บอร์ดหลัก (จอ + เว็บพอร์ทัล + OBD client)
; esp32s3-simulator : บอร์ดจำลอง OBD2 WiFi adapter สำหรับทดสอบโดยไม่ต้องขึ้นรถ
; esp32c3-reader    : บอร์ดอ่านแรงดันแยก (ออปชัน)
; ============================================================

; --- ESP32-S3 Zero : Dashboard + Display ---
[env:esp32s3-dashboard]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> -<main_c3.cpp>
board_build.flash_size = 4MB
board_build.partitions = partitions_4mb_ota_largeapp.csv
board_build.filesystem = littlefs
build_flags =
	-Os
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-mlongcalls
	-ffunction-sections
	-fdata-sections
	-Wl,--gc-sections
lib_deps =
	adafruit/Adafruit GFX Library @ ^1.11.9
	adafruit/Adafruit ST7735 and ST7789 Library @ ^1.10.3
	bitbank2/AnimatedGIF @ ^2.1.1

; --- ESP32-C3 SuperMini : Voltage Reader ---
[env:esp32c3-reader]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_src_filter = +<main_c3.cpp>
lib_deps =
	adafruit/Adafruit GFX Library @ ^1.11.9
	adafruit/Adafruit ST7735 and ST7789 Library @ ^1.10.3
